name: Build Android APK (EAS)

# Single release build pipeline.
#
# Runs once per `v*` tag push — never on branch pushes — so a normal commit and
# its release tag cannot create duplicate workflow runs. The same job compiles
# with `eas build --local` (managed credentials) and falls back to a plain
# Gradle release build when EXPO_TOKEN is absent.
#
# Required repository secret:
#   EXPO_TOKEN  - Expo personal access token (https://expo.dev/settings/access-tokens)
#
# EXPO_PUBLIC_POCKETBASE_URL is hard-coded to the live PocketBase host below, so
# the compiled APK can never fall back to local/offline mode.
#
# The runner-built APK is attached to the workflow run and to the GitHub Release
# for the pushed tag, where the in-app updater picks it up.

on:
  push:
    tags:
      - 'v*'

# A newer push supersedes an in-flight APK build.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile preview APK on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_POCKETBASE_URL: https://pocket.enjoydonerkebab.pl

      # eas.json profile to compile. The preview profile emits an APK
      # (distribution: internal, android.buildType: apk).
      EAS_BUILD_PROFILE: preview

      # Android toolchain. ubuntu-latest already ships the SDK at this path; we
      # pin the exact versions required by Expo SDK 58 / React Native 0.88.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.1.12297006

      # RN 0.88 + AGP 9 need more heap than the 2 GB default on a cold runner.
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
      # Metro's release bundle can exceed the default Node heap on CI.
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Expo SDK 58 / React Native 0.88 require Node >= 22.13.0.
          # Node 18/20 are not supported by this dependency tree.
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            # Command-line tools live under cmdline-tools/<version>/bin on the
            # runner image; pick the newest one if `latest` is not on PATH.
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          export PATH="$SDKMANAGER_DIR:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          # Accept any new SDK/NDK licences before installing missing packages.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Pin the toolchain required by the React Native 0.88 version catalog:
          #   compileSdk 37, buildTools 37.0.0, NDK 27.1.12297006
          # The runner image ships NDK 27.3/29/30 but NOT 27.1, which Gradle
          # looks up by exact version. Only install what is actually missing.
          install_pkg() {
            local pkg="$1"
            if "$SDKMANAGER" --list_installed 2>/dev/null | grep -Fq "$pkg"; then
              echo "Already installed: $pkg"
            else
              echo "Installing: $pkg"
              "$SDKMANAGER" --install "$pkg"
            fi
          }

          install_pkg "platform-tools"
          install_pkg "platforms;android-37.0"
          install_pkg "build-tools;37.0.0"
          install_pkg "ndk;27.1.12297006"
          install_pkg "cmake;3.22.1"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.1.12297006"
            echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.1.12297006"
          } >> "$GITHUB_ENV"
          {
            echo "$SDKMANAGER_DIR"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/emulator"
          } >> "$GITHUB_PATH"

          echo "Android platforms:"
          ls -1 "$SDK_ROOT/platforms"
          echo "Android NDKs:"
          ls -1 "$SDK_ROOT/ndk"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $APP_VERSION | tag: $TAG_VERSION"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $APP_VERSION"
            exit 1
          fi

      - name: Verify live PocketBase configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "EXPO_PUBLIC_POCKETBASE_URL=$EXPO_PUBLIC_POCKETBASE_URL"
          if [ -z "${EXPO_PUBLIC_POCKETBASE_URL:-}" ] || [ "${EXPO_PUBLIC_POCKETBASE_URL,,}" = "demo" ]; then
            echo "::error::EXPO_PUBLIC_POCKETBASE_URL must be a real URL, got '${EXPO_PUBLIC_POCKETBASE_URL:-}'"
            exit 1
          fi

          # app.config.js is evaluated with the same environment as the build
          # steps. Assert the normalized URL is actually baked into `extra`.
          # Pipe via stdin so no temp-file path assumptions are needed.
          npx expo config --type public --json | node -e '
            let src = "";
            process.stdin.on("data", (chunk) => { src += chunk; });
            process.stdin.on("end", () => {
              const config = JSON.parse(src);
              const url = config.extra && config.extra.pocketbaseUrl;
              const source = config.extra && config.extra.pocketbaseUrlSource;
              const expected = process.env.EXPO_PUBLIC_POCKETBASE_URL.replace(/\/+$/, "");
              console.log("extra.pocketbaseUrl:", url, "| source:", source);
              if (url !== expected || url === "demo") {
                console.error("::error::expo config resolved pocketbaseUrl to " + url + ", expected " + expected);
                process.exit(1);
              }
            });
          '

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Detect Expo credentials
        id: expo_auth
        shell: bash
        run: |
          # EAS local builds normally require an Expo login/EXPO_TOKEN. When the
          # secret is absent (or invalid) fall back to a plain Gradle release
          # build so the workflow still produces an installable APK.
          set +e
          eas --version
          if [ -n "${EXPO_TOKEN:-}" ] && eas whoami; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN detected. Building with EAS local (managed credentials)."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=EXPO_TOKEN not available::Building with Gradle fallback (debug-signed APK). Add an EXPO_TOKEN repository secret for a managed EAS-signed build."
          fi

      - name: Write build environment
        shell: bash
        run: |
          set -euo pipefail
          # Expo CLI inlines EXPO_PUBLIC_* variables at bundle time. Exporting it
          # above is enough, but writing .env keeps local reproductions identical.
          printf 'EXPO_PUBLIC_POCKETBASE_URL=%s\n' "$EXPO_PUBLIC_POCKETBASE_URL" > .env
          cat .env

      - name: Build APK locally with EAS
        id: eas_build
        if: steps.expo_auth.outputs.available == 'true'
        # If EAS fails for a credentials/cloud reason, still try the Gradle
        # fallback below instead of failing the whole workflow immediately.
        continue-on-error: true
        # Re-export explicitly: app.config.js and Metro both read this while
        # generating the native project and the release JS bundle.
        env:
          EXPO_PUBLIC_POCKETBASE_URL: https://pocket.enjoydonerkebab.pl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          eas build \
            --platform android \
            --local \
            --profile "$EAS_BUILD_PROFILE" \
            --non-interactive \
            --output "./build/bb-manager-$EAS_BUILD_PROFILE.apk"

      - name: Build APK with Gradle fallback
        id: gradle_build
        if: steps.expo_auth.outputs.available != 'true' || steps.eas_build.outcome == 'failure'
        # The Gradle bundle task still runs Metro; keep the live URL in its env.
        env:
          EXPO_PUBLIC_POCKETBASE_URL: https://pocket.enjoydonerkebab.pl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          # No Expo token (or EAS failed): generate the native project and build
          # a standalone release APK with Gradle. The Expo-generated release
          # build type is signed with the debug keystore, so this APK installs on
          # a device without requiring EAS credentials.
          npx expo prebuild --platform android --clean --no-install
          (
            cd android
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.enableMinifyInReleaseBuilds=false \
              -Pandroid.enableShrinkResourcesInReleaseBuilds=false
          )

          APK_PATH="$(find android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle did not produce an APK"
            exit 1
          fi
          cp "$APK_PATH" "build/bb-manager-$EAS_BUILD_PROFILE.apk"
          echo "Gradle fallback APK: $APK_PATH"

      - name: Collect APK
        if: always()
        shell: bash
        env:
          EAS_OUTCOME: ${{ steps.eas_build.outcome }}
        run: |
          set -euo pipefail
          mkdir -p build

          # `--output` is the primary location. If a future EAS CLI ignores it,
          # fall back to the first APK produced in the build directory.
          if ! compgen -G "build/*.apk" > /dev/null; then
            APK_PATH="$(find build . -maxdepth 4 -type f -name '*.apk' \
              -not -path './node_modules/*' -not -path './android/*' \
              -print -quit 2>/dev/null || true)"
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" "build/bb-manager-$EAS_BUILD_PROFILE.apk"
            fi
          fi

          ls -lh build
          if compgen -G "build/*.apk" > /dev/null; then
            sha256sum build/*.apk

            {
              echo "### Android APK built locally"
              echo ""
              echo "Profile: \`$EAS_BUILD_PROFILE\`"
              echo ""
              if [ "$EAS_OUTCOME" != "success" ]; then
                echo "> **Fallback build:** EXPO_TOKEN was not available (or the EAS build failed), so this APK was compiled with Gradle and signed with the debug keystore. Add the \`EXPO_TOKEN\` repository secret for a managed EAS-signed APK."
                echo ""
              fi
              echo "| File | Size | SHA-256 |"
              echo "| --- | --- | --- |"
              for apk in build/*.apk; do
                echo "| \`$(basename "$apk")\` | $(du -h "$apk" | cut -f1) | \`$(sha256sum "$apk" | cut -d' ' -f1)\` |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bb-manager-${{ env.EAS_BUILD_PROFILE }}-apk-${{ github.run_number }}
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BB Manager ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
